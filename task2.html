
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Assignment 6 - The Party in Motion</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/task2.css">

<body>
    <header class="page-header">
        <h1>The Party in Motion</h1>
        <p>Assignment 6 - jQuery Effects and Animations</p>
    </header>

    <main class="container">
        <section class="party-section">
            <h2>The Party: 19:30 - 22:30</h2>
            <div id="partyHouse" class="party-house"></div>
        </section>

        <section class="cases-section">
            <h2>Detective Cases</h2>

            <div id="caseButtons" class="case-buttons"></div>

            <button id="clearBtn" type="button">
                Clear Selection
            </button>

            <div id="caseResult" class="case-result"
                 role="status" aria-live="polite">
                Select a case to start.
            </div>
        </section>
    </main>

    <div id="guestOverlay" class="guest-overlay">
        <div id="guestModal" class="guest-modal"
             role="dialog" aria-modal="true"
             aria-label="Guest information"
             tabindex="-1">
            <div id="guestDetails"></div>
            <div id="moveButtons"></div>
        </div>
    </div>
